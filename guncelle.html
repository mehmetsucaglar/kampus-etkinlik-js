<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Güncelle</title>
    <!-- Öğrenci numaran ile CSS bağlantısı -->
    <link rel="stylesheet" href="css/2416501032.css">
</head>
<body>
    <nav>
        <a href="index.html">Ana Sayfa</a> | 
        <a href="etkinlikler.html">Tüm Etkinlikler</a> | 
        <a href="ekle.html">Etkinlik Ekle</a>
    </nav>
    
    <main>
        <h1>Etkinlik Güncelle</h1>
        <div id="form-message"></div>
        <form id="add-event-form">
            <!-- Güncelleme modülü mevcut JS'i kullanarak adresteki ID'yi yakalar -->
            <input type="hidden" name="id" id="update-id">
            
            <label>Etkinlik Adı: <input type="text" name="title" id="update-title"></label><br><br>
            <label>Tarih: <input type="date" name="date" id="update-date"></label><br><br>
            <label>Kategori: 
                <select name="category" id="update-category">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Konser">Konser</option>
                    <option value="Fuar">Fuar</option>
                    <option value="Yarışma">Yarışma</option>
                </select>
            </label><br><br>
            <button type="submit" style="background-color: #f39c12;">Değişiklikleri Kaydet</button>
        </form>
    </main>

    <!-- Modül olarak form işleyiciyi ve güncelleme doldurucuyu çağırıyoruz -->
    <script type="module">
        import { events } from './js/data.js';
        
        // Sayfa yüklendiğinde URL'den ID'yi alıp formu doldur
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const event = events.find(e => e.id === id);
            
            if(event) {
                document.getElementById('update-id').value = event.id;
                document.getElementById('update-title').value = event.title;
                document.getElementById('update-date').value = event.date;
                document.getElementById('update-category').value = event.category;
            } else {
                document.getElementById('form-message').innerHTML = '<div class="error">Güncellenecek etkinlik bulunamadı veya ID eksik.</div>';
            }
        });
        <div style="margin-bottom: 20px;">
        <a href="index.html" class="btn" style="background-color: #34495e;">⬅️ Ana Sayfa</a>
    </div>
    </script>
    <script type="module" src="js/event-form.js"></script>
</body>
</html>
